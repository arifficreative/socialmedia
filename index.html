<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>www.r3pflix.me</title>
    <style>
        /* --- GENERAL STYLES --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding-top: 80px; 
            display: flex;
            flex-direction: column;
            align-items: center; 
            min-height: 100vh;
            overflow-x: hidden; 
        }

        /* --- NAVBAR --- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            border-bottom: 1px solid #dbdbdb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .brand-name {
            font-size: 22px;
            font-weight: bold;
            color: #262626;
            text-decoration: none;
            letter-spacing: -1px;
        }

        .nav-links a {
            text-decoration: none;
            color: #262626;
            font-size: 14px;
            font-weight: 500;
        }

        /* --- ANIMATED HEADER STYLES --- */
        .feed-header {
            text-align: center;
            margin-bottom: 30px;
            max-width: 600px;
            padding: 0 20px;
        }

        /* Animation Definition: Focus In */
        @keyframes focusIn {
            0% {
                filter: blur(12px);
                opacity: 0;
                transform: scale(0.9); /* Starts slightly smaller */
            }
            100% {
                filter: blur(0);
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Animation Definition: Slide Up (for the bottom text) */
        @keyframes slideUpFade {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feed-header h1 {
            /* Applies the blur effect */
            animation: focusIn 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
            font-weight: 700;
            line-height: 1.4;
        }

        .feed-header p {
            color: #8e8e8e;
            /* Applies the slide up effect with a 1-second delay */
            animation: slideUpFade 1s ease forwards;
            opacity: 0; /* Start hidden */
            animation-delay: 1s; /* Wait for H1 to finish before showing */
        }

        /* --- SMARTPHONE CONTAINER STYLES --- */
        .smartphone-frame {
            width: 320px; 
            aspect-ratio: 9 / 16; 
            background-color: #000; 
            border: 12px solid #1a1a1a; 
            border-radius: 40px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
            position: relative;
            overflow: hidden; 
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            touch-action: pan-y; 
        }

        /* --- VIDEO STYLES --- */
        .feed-image {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            grid-area: 1 / 1;
            opacity: 0;
            transition: opacity 1s ease; 
        }

        .feed-image.fit-screen {
            object-fit: contain; 
        }

        .feed-image.active {
            opacity: 1;
            z-index: 1;
        }

        /* --- DOTS STYLES --- */
        .slider-dots {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background-color: #ffffff;
            transform: scale(1.3);
        }

    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="brand-name">www.r3pflix.me</a>
        <div class="nav-links">
            <a href="https://wa.link/lw6tsu" target="_blank">Contact</a>
        </div>
    </nav>

    <div class="feed-header">
        <h1>If you feel pain in your eyes when you see people's decisions, <br>then you are suffering from an evil eye.</h1>
        <p style="color: #8e8e8e;">Tempat ni website bukan lu yang cipta.</p>
    </div>

    <div class="smartphone-frame" id="slider">
        
        <video class="feed-image fit-screen active" 
               autoplay muted loop playsinline 
               onclick="window.open('https://google.com', '_blank')" 
               style="cursor: pointer;">
            <source src="website2.mp4" type="video/mp4">
        </video>
        
        <video class="feed-image" autoplay muted loop playsinline>
            <source src="website3.mp4" type="video/mp4">
        </video>
        
        <video class="feed-image" autoplay muted loop playsinline>
            <source src="website1.mp4" type="video/mp4">
        </video>

        <div class="slider-dots">
            <span class="dot active" onclick="jumpToSlide(0)"></span>
            <span class="dot" onclick="jumpToSlide(1)"></span>
            <span class="dot" onclick="jumpToSlide(2)"></span>
        </div>
    </div>

    <script>
        const sliderContainer = document.getElementById('slider');
        const slides = document.querySelectorAll('.feed-image');
        const dots = document.querySelectorAll('.dot');
        let currentSlide = 0;
        let slideInterval;

        function updateSlider(index) {
            slides.forEach(slide => slide.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));

            const nextVideo = slides[index];
            nextVideo.currentTime = 0; 
            nextVideo.play(); 

            nextVideo.classList.add('active');
            dots[index].classList.add('active');
            
            currentSlide = index;
        }

        function nextSlide() {
            let nextIndex = (currentSlide + 1) % slides.length;
            updateSlider(nextIndex);
        }

        function prevSlide() {
            let prevIndex = (currentSlide - 1 + slides.length) % slides.length;
            updateSlider(prevIndex);
        }

        function jumpToSlide(index) {
            updateSlider(index);
            resetTimer();
        }

        function startTimer() {
            slideInterval = setInterval(nextSlide, 30000); 
        }

        function resetTimer() {
            clearInterval(slideInterval);
            startTimer();
        }

        let touchStartX = 0;
        let touchEndX = 0;

        sliderContainer.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        sliderContainer.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            let swipeDistance = touchEndX - touchStartX;
            if (Math.abs(swipeDistance) > 50) { 
                if (swipeDistance < 0) {
                    nextSlide(); 
                } else {
                    prevSlide(); 
                }
                resetTimer();
            }
        }

        startTimer();
    </script>

</body>
</html>
