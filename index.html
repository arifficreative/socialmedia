<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>www.r3pflix.me</title>
    <style>
        /* --- GENERAL STYLES --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding-top: 80px; 
            display: flex;
            flex-direction: column;
            align-items: center; 
            min-height: 100vh;
        }

        /* --- NAVBAR --- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            border-bottom: 1px solid #dbdbdb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .brand-name {
            font-size: 22px;
            font-weight: bold;
            color: #262626;
            text-decoration: none;
            letter-spacing: -1px;
        }

        .nav-links a {
            text-decoration: none;
            color: #262626;
            font-size: 14px;
            font-weight: 500;
        }

        .feed-header {
            text-align: center;
            margin-bottom: 30px;
            max-width: 600px;
            padding: 0 20px;
        }

        /* --- SMARTPHONE CONTAINER STYLES --- */
        .smartphone-frame {
            /* 1080x1920 ratio */
            width: 320px; 
            aspect-ratio: 9 / 16; 
            
            /* Phone Aesthetics */
            background-color: #000; 
            border: 12px solid #1a1a1a; 
            border-radius: 40px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
            position: relative;
            overflow: hidden; 
            
            /* Stack videos inside */
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
        }

        /* --- VIDEO STYLES --- */
        .feed-image {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            grid-area: 1 / 1;
            opacity: 0;
            transition: opacity 1s ease; 
        }

        /* Class for Landscape videos to fit inside the screen */
        .feed-image.fit-screen {
            object-fit: contain; 
        }

        .feed-image.active {
            opacity: 1;
            z-index: 1;
        }

        /* --- DOTS STYLES --- */
        .slider-dots {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background-color: #ffffff;
            transform: scale(1.3);
        }

    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="brand-name">www.r3pflix.me</a>
        <div class="nav-links">
            <a href="https://wa.link/lw6tsu" target="_blank">Contact</a>
        </div>
    </nav>

    <div class="feed-header">
        <h1>If you feel pain in your eyes when you see people's decisions, <br>then you are suffering from an evil eye.</h1>
        <p style="color: #8e8e8e;">Tempat ni website bukan lu yang cipta.<br> #tapiengkaumemilihseolahengkautaktahu</p>
    </div>

    <div class="smartphone-frame" id="slider">
        
        <video class="feed-image fit-screen active" 
               autoplay muted loop playsinline 
               onclick="window.open('https://www.youtube.com/watch?v=auhjO7rM2Xc', '_blank')" 
               style="cursor: pointer;">
            <source src="website2.mp4" type="video/mp4">
        </video>
        
        <video class="feed-image" autoplay muted loop playsinline>
            <source src="website3.mp4" type="video/mp4">
        </video>
        
        <video class="feed-image" autoplay muted loop playsinline>
            <source src="website1.mp4" type="video/mp4">
        </video>

        <div class="slider-dots">
            <span class="dot active" onclick="jumpToSlide(0)"></span>
            <span class="dot" onclick="jumpToSlide(1)"></span>
            <span class="dot" onclick="jumpToSlide(2)"></span>
        </div>
    </div>

    <script>
        const slides = document.querySelectorAll('.feed-image');
        const dots = document.querySelectorAll('.dot');
        let currentSlide = 0;
        let slideInterval;

        function updateSlider(index) {
            // 1. Hide all slides and reset dots
            slides.forEach(slide => slide.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));

            // 2. Prepare the NEW slide
            const nextVideo = slides[index];

            // --- RESTART LOGIC ---
            nextVideo.currentTime = 0; 
            nextVideo.play(); 

            // 3. Show the new slide
            nextVideo.classList.add('active');
            dots[index].classList.add('active');
            
            currentSlide = index;
        }

        function nextSlide() {
            let nextIndex = (currentSlide + 1) % slides.length;
            updateSlider(nextIndex);
        }

        function jumpToSlide(index) {
            updateSlider(index);
            resetTimer();
        }

        function startTimer() {
            // 20 Seconds
            slideInterval = setInterval(nextSlide, 20000);
        }

        function resetTimer() {
            clearInterval(slideInterval);
            startTimer();
        }

        startTimer();
    </script>

</body>
</html>
